  <g transform="translate(3.63 5.35) scale(0.86)" fill="#FF6A00">
    <path d="M29 16 C22 11 14 10 7 12 L7 48 C14 46 22 47 29 52 Z"/>
    <rect x="35" y="15" width="24" height="5.4" rx="2.7"/>
    <rect x="35" y="25" width="17" height="5.4" rx="2.7" opacity=".8"/>
    <rect x="35" y="35" width="22" height="5.4" rx="2.7" opacity=".62"/>
    <rect x="35" y="45" width="13" height="5.4" rx="2.7" opacity=".45"/>
