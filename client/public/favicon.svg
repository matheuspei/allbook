<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    O ícone do AllBook — a mesma marca de client/src/components/MarcaAllBook.tsx,
    no traje que o Matheus escolheu em 05/08: laranja sobre quadrado escuro.
    O que estava aqui antes era o logo do Replit, sobra do andaime.

    As opacidades sobem em relação ao componente (.8 / .62 / .45 no lugar de
